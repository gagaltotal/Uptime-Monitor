server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Docker's embedded DNS at 127.0.0.11, re-resolved every 10s via the
    # variable-based proxy_pass below — avoids nginx pinning a stale IP for
    # the `backend` service if that container gets recreated later.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # nginx quirk (verified against a live instance during development):
    # add_header does NOT merge across nesting levels. If a location block
    # defines its own add_header (e.g. Cache-Control below), any add_header
    # set only at the server level is silently dropped for that location
    # instead of inherited. So the security headers are repeated explicitly
    # inside every location that serves a browser-facing response, rather
    # than declared once at the server level where they'd quietly vanish.

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # REST API — proxied straight through to the backend, which stays off
    # the host network entirely (see docker-compose.yml). This also means
    # browser calls to /api/* are same-origin, so no CORS preflight and no
    # cross-site cookie concerns for the refresh-token cookie. Security
    # headers for these responses come from the Express app itself (helmet
    # — see backend/src/middleware/security.js) and pass through untouched.
    location /api/ {
        set $backend_upstream http://backend:5000$request_uri;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — needs the Upgrade/Connection headers for the WebSocket
    # handshake, plus a long read timeout so idle connections aren't cut.
    location /socket.io/ {
        set $backend_upstream http://backend:5000$request_uri;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback — client-side routing (React Router) handles the path
    # from here; index.html itself is never cached since it references the
    # current content-hashed asset filenames.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
