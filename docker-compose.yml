name: uptime-monitor

services:

  # ================================================================
  # MONGODB
  # ================================================================
  mongodb:
    image: mongo:7
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}

    volumes:
      - mongo_data:/data/db

    networks:
      - internal

    # MongoDB TIDAK dibuka ke host.
    # Hanya backend yang dapat mengaksesnya.

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ================================================================
  # BACKEND
  # ================================================================
  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      NODE_ENV: production

      PORT: 5000

      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8097}

      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

      HEARTBEAT_RETENTION_DAYS: ${HEARTBEAT_RETENTION_DAYS:-90}

      TRUST_PROXY: "true"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - internal
      - web

    cap_add:
      - NET_RAW

    # Tidak ada ports:
    # Backend hanya diakses frontend melalui jaringan Docker.

  # ================================================================
  # FRONTEND
  # ================================================================
  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "8097:80"

    depends_on:
      - backend

    networks:
      - web


# ================================================================
# NETWORKS
# ================================================================
networks:

  # MongoDB + backend saja.
  # Tidak memiliki akses langsung dari host/internet.
  internal:
    internal: true

  # Frontend + backend.
  web:


# ================================================================
# VOLUMES
# ================================================================
volumes:
  mongo_data: